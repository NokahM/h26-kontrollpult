<!doctype>
<html>
  <head>
    <meta charset="utf-8">
    <title>WEA</title>

    <script>
      function serviceWorkerSjekk() {
        if( ! ( 'serviceWorker' in navigator) )

           alert ('"ServiceWorker" er ikke støttet');

        else {

           navigator.serviceWorker.register('./serviceArbeider.js'       ).then  (
              function (reg)     { alert ('Installasjon fullført')     } ).catch (
              function (err)     { alert ('Innstallasjon feilet:'+err) }
              );
        }
      }

    </script>
  </head>

  <body onload=serviceWorkerSjekk() >

    <ul>
      <li>    <a href='./p1.txt'> p1 </a> </li>
      <li>    <a href='./p2.txt'> p2 </a> </li>
      <li>    <a href='./p3.txt'> p3 </a> </li>
      <li>    <a href='./p4.txt'> p4 </a> </li>
      <li>    <a href='./p5.txt'> p5 </a> </li>
    </ul>

  </body>
</html>

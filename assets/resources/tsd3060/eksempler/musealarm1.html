<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Musealarm 1</title>
    <script>

      function musealarm(hendelse) {
        alert('Du trykket musknapp nr.' +
          hendelse.button);
      }

      function initialisering() {

        // document.getElementById('musefelle').
	document.querySelector('#musefelle').
          addEventListener(
            'mousedown', musealarm, false);
      }

    </script>
  </head>

  <body onload=initialisering()>
    <p id="musefelle">Ostebit</p>
  </body>
</html>
